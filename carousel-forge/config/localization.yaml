# ─────────────────────────────────────────────────────────────────────────────
# 현지화 설정 — A10 Localizer가 읽는 유일한 수치 원천
#
# 여기 있는 값은 "언어와 언어 사이의 관계"다. 플랫폼 규격(config/platforms.yaml)
# 과는 다른 축이므로 파일을 나눴다. 폰트는 여기에 두지 않는다 — 어떤 폰트를 쓰는지는
# 계정의 StyleDNA(`visual.typography.chinese_font` 등)가 정한다 (절대 규칙 #8).
# ─────────────────────────────────────────────────────────────────────────────

_meta:
  schema_version: 1
  verified_at: "2026-08-19"
  note: >
    char_ratio는 빌드 스펙 §4.2 A10의 "중국어는 같은 의미를 한국어보다 15~30%
    짧게 표현한다"에서 왔다. 언어학적 측정치가 아니라 스펙이 제시한 작업 가정이며,
    실제 상한은 렌더로 실측한 수용량(core/render/capacity.py)이 함께 정한다.

languages:
  ko:
    display_name: "한국어"
    script: hangul
    #: 글자 하나가 차지하는 폭이 대체로 일정한가. 실측 수용량 계산의 전제.
    monospaced_script: true
    register_note: >
      말투(해요체/합쇼체/반말)가 문장마다 드러난다. 어미가 계정 정체성의 일부다.
  zh:
    display_name: "简体中文"
    script: han
    monospaced_script: true
    register_note: >
      한국어 같은 종결어미 체계가 없다. 말투는 어미가 아니라 어휘 선택·문장 길이·
      어기조사(吧/呢/啦)로 드러난다. 존댓말을 직역해 "您"을 남발하면 어색해진다.

pairs:
  ko->zh:
    #: 같은 의미를 쓸 때 목표 언어가 필요로 하는 글자수 비율 [최소, 최대].
    #: 상한(0.85)을 하드 제약으로 쓰고, 하한은 프롬프트의 목표치로만 쓴다.
    #: 상한을 하드 제약으로 두는 이유: 상한을 넘겨야 위반이고, 짧게 쓴 것은
    #: 위반이 아니다. 하한을 강제하면 의미를 깎아 내야 통과하는 상황이 생긴다.
    char_ratio: [0.70, 0.85]
    guidance: >
      직역하지 마라. 한국어 문장을 중국어 어순으로 옮기는 것이 아니라, 같은
      메시지를 중국어 독자가 스스로 쓰듯이 다시 쓴다. 한자어를 그대로 옮기면
      뜻이 어긋나는 경우가 많다(공부↔工夫, 애인↔爱人). 관용구는 대응하는
      중국어 관용구로 바꾸고, 없으면 풀어 쓴다.
    hashtag_note: >
      해시태그는 번역 대상이 아니다. 중국어권에서 실제로 쓰이는 태그를 다시
      조사해서 넣는다. 한국어 태그를 직역한 태그는 검색량이 사실상 0이다.
