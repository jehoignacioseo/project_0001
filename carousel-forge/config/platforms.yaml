# ─────────────────────────────────────────────────────────────────────────────
# 플랫폼 규격 — 단일 진실 소스 (Single Source of Truth)
#
# 절대 규칙 #2: 플랫폼 규격을 코드에 하드코딩하지 않는다. 코드는 이 파일만 읽는다.
# 규격이 바뀌면 이 파일만 고치면 된다. `python scripts/validate_platforms.py`로
# 스키마 정합성을 검증한다.
#
# 갱신 이력:
#   2026-08 — 최초 작성. 값의 출처·최종 확인일은 `_meta.verified_at`에 기록한다.
# ─────────────────────────────────────────────────────────────────────────────

_meta:
  schema_version: 1
  verified_at: "2026-08-19"
  note: >
    canvas/caption/hashtag 수치는 각 플랫폼 정책 변경에 따라 달라진다.
    빌드 파이프라인은 verified_at이 180일 이상 지나면 경고를 낸다.
  # A6 FactChecker(`scripts/demo_m5.py`)가 이 파일의 값을 웹에서 검증한 결과다.
  # 1차 출처로 확인된 값과 그렇지 않은 값을 구분해 둔다 — 근거가 약한 값을
  # 확신하는 척하지 않기 위해서다.
  source_check:
    checked_at: "2026-08-19"
    verified:
      - field: instagram.max_slides
        value: 20
        source: https://help.instagram.com/269314186824048/
        note: 인스타그램 공식 고객센터 문서에 "최대 20개" 명시
      - field: instagram.caption_max_chars
        value: 2200
        source: https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media
        note: Meta 개발자 문서의 caption 파라미터에 "Maximum 2200 characters" 명시
    unverified:
      - field: instagram.caption_fold_at
        value: 125
        note: >
          Hootsuite·Sendible 등 2차 출처가 일관되게 125자를 말하지만 Meta의
          1차 출처를 찾지 못했다. 값은 유지하되 확정된 규격으로 취급하지 않는다.
      - field: xiaohongshu.topic_tag_format
        value: "#{tag}[话题]#"
        note: >
          샤오홍슈 앱이 话题(토픽) 태그를 본문에 삽입할 때 넣는 표기다. 널리
          관찰되지만 공식 문서로 확인하지 못했다. 표기가 틀리면 태그가 일반
          텍스트로 들어가 노출이 되지 않으므로, 첫 게시 때 사람이 확인해야 한다.
      - field: xiaohongshu.cover_min_blocks
        value: 3
        note: >
          "커버 정보 밀도가 높다"는 문화적 관찰을 판정 가능한 수치로 옮긴 값이며
          플랫폼 규격이 아니다. 넘으면 막는 하드 제약이 아니라 경고로만 쓴다.
      - field: xiaohongshu.title_max_chars
        value: 20
        note: >
          중국어권 운영 콘텐츠에서 널리 반복되나 샤오홍슈 공식 문서를 확인하지
          못했고 출처 간 설명이 갈린다(disputed). 커버 카피 설계의 핵심 제약이므로
          실제 게시로 한 번 확인해 볼 필요가 있다.

defaults:
  # 플랫폼별 값이 없을 때만 적용되는 폴백
  export_format: ["png"]
  quality: 95
  dpi: 72

instagram:
  display_name: "Instagram"
  canvas: { width: 1080, height: 1350, ratio: "4:5" }   # 2026 기준 피드 기본 세로형
  alt_canvas:
    square: { width: 1080, height: 1080, ratio: "1:1" }
    portrait_story: { width: 1080, height: 1920, ratio: "9:16" }
  max_slides: 20
  min_slides: 2
  caption_max_chars: 2200
  caption_fold_at: 125              # 이 지점 전에 훅이 끝나야 함
  hashtag_max: 30
  hashtag_recommended: [8, 15]
  safe_margin_px: 90
  export_format: ["jpg", "png"]
  quality: 95
  title_max_chars: null             # IG는 커버 제목 글자수 제한 없음
  body_max_chars: null
  cover_info_density: low           # 커버는 훅 한 문장
  cover_min_blocks: 1               # 헤드라인 하나로 끝나도 된다
  topic_tag_format: "#{tag}"
  emoji_density: low
  default_language: ko
  culture_prompt: >
    여백과 절제, 비주얼 우선. 커버는 훅 한 문장으로 끝낸다.
    정보를 커버에 몰아넣지 않고 2번 슬라이드부터 전개한다.
    이모지는 최소한으로, 문장 부호는 담백하게.

xiaohongshu:
  display_name: "小红书 (RED)"
  canvas: { width: 1080, height: 1440, ratio: "3:4" }   # 피드 노출 면적 최대
  alt_canvas:
    square: { width: 1080, height: 1080, ratio: "1:1" }
  max_slides: 18
  min_slides: 1
  caption_max_chars: 1000
  caption_fold_at: 80
  hashtag_max: 10                   # 话题 태그
  hashtag_recommended: [5, 10]
  safe_margin_px: 96
  export_format: ["jpg", "png"]
  quality: 95
  title_max_chars: 20               # ★ 제목 20자 제한 — 커버 카피 설계의 핵심 제약
  body_max_chars: 1000
  topic_tag_max: 10
  cover_info_density: high          # IG 대비 커버에 정보를 더 싣는 문화
  cover_min_blocks: 3               # 제목만 있는 커버는 이 플랫폼에서 심심하게 읽힌다
  topic_tag_format: "#{tag}[话题]#"  # 话题 태그의 앱 삽입 표기
  emoji_density: high
  default_language: zh
  culture_prompt: >
    정보 밀도 우선. 커버에 제목 + 부제 + 뱃지 + 포인트까지 싣는다.
    이모지와 색상 대비를 강하게 쓰고 「」·【】 괄호 장식을 관용적으로 사용한다.
    제목은 20자를 넘기면 잘리므로 20자 안에서 승부한다.
